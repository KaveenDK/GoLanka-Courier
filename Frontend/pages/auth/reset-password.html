<!DOCTYPE html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset password — GoLanka Courier</title>
    <link rel="icon" href="../../assets/images/logo.png" />

    <!-- Optional: override backend base & signin redirect -->
    <script>
      window.API_BASE = window.API_BASE || "http://localhost:8080";
      window.SIGNIN_PAGE = window.SIGNIN_PAGE || "signin.html";
    </script>

    <!-- Tailwind (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- jQuery (used for convenience) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Local CSS -->
    <link rel="stylesheet" href="../../css/styles.css" />
    <link rel="stylesheet" href="../../css/animations.css" />
  </head>

  <body
    class="bg-gray-50 dark:bg-slate-900 min-h-screen flex items-center justify-center p-6"
  >
    <main
      class="w-full max-w-md bg-white dark:bg-slate-800 rounded-xl shadow-lg p-6"
      role="main"
      aria-labelledby="reset-heading"
    >
      <header class="mb-6">
        <h1 id="reset-heading" class="text-2xl font-bold">
          Reset your password
        </h1>
        <p class="text-sm text-slate-500 mt-1">
          Paste the token you received (or open this page using the link in your
          email).
        </p>
      </header>

      <form id="resetForm" class="space-y-4" novalidate>
        <label class="block">
          <span class="text-sm font-medium">Reset token</span>
          <input
            id="token"
            name="token"
            type="text"
            class="input mt-1"
            placeholder="paste your reset token here (or use ?token=...)"
            required
            autocomplete="off"
            aria-describedby="token-help"
          />
          <p id="token-help" class="text-xs text-slate-400 mt-1">
            Use the token from your email or open the reset link.
          </p>
          <p
            class="text-xs text-red-500 mt-1 hidden field-error"
            data-field="token"
            role="alert"
            aria-live="polite"
          ></p>
        </label>

        <label class="block">
          <span class="text-sm font-medium">New password</span>
          <div class="relative">
            <input
              id="newPassword"
              name="newPassword"
              type="password"
              class="input mt-1 pr-10"
              placeholder="At least 8 characters"
              required
              autocomplete="new-password"
            />
            <button
              type="button"
              id="toggleNewPwd"
              class="absolute right-2 top-2 text-sm text-slate-500"
              aria-pressed="false"
            >
              Show
            </button>
          </div>
          <p
            class="text-xs text-red-500 mt-1 hidden field-error"
            data-field="newPassword"
            role="alert"
            aria-live="polite"
          ></p>
        </label>

        <label class="block">
          <span class="text-sm font-medium">Confirm password</span>
          <div class="relative">
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              class="input mt-1 pr-10"
              placeholder="Re-enter new password"
              required
              autocomplete="new-password"
            />
            <button
              type="button"
              id="toggleConfirmPwd"
              class="absolute right-2 top-2 text-sm text-slate-500"
              aria-pressed="false"
            >
              Show
            </button>
          </div>
          <p
            class="text-xs text-red-500 mt-1 hidden field-error"
            data-field="confirmPassword"
            role="alert"
            aria-live="polite"
          ></p>
        </label>

        <div class="flex items-center gap-3">
          <button id="resetBtn" type="submit" class="btn btn-primary">
            Reset password
          </button>
          <a href="signin.html" class="text-sm text-slate-500 hover:underline"
            >Back to sign in</a
          >
        </div>
      </form>
    </main>

    <!-- Prefer central API helper if present -->
    <script src="../../js/script.js"></script>

    <script>
      /*
       * Reset password page script
       * - Prefills token from ?token=... if present
       * - Uses window.GoLankaApi.resetPassword() when available
       * - Falls back to POST /api/auth/reset-password against window.API_BASE
       * - Displays field-level validation errors and friendly messages
       */

      (function ($, Swal, GoLankaApi) {
        "use strict";

        const $form = $("#resetForm");
        const $token = $("#token");
        const $new = $("#newPassword");
        const $confirm = $("#confirmPassword");
        const $btn = $("#resetBtn");
        const $toggleNew = $("#toggleNewPwd");
        const $toggleConf = $("#toggleConfirmPwd");

        function clearErrors() {
          $(".field-error").each(function () {
            $(this).addClass("hidden").text("");
          });
        }

        function showFieldError(field, msg) {
          const $el = $(`.field-error[data-field="${field}"]`);
          if ($el.length) {
            $el.removeClass("hidden").text(msg);
          } else {
            // fallback toast
            if (Swal) Swal.fire("Error", msg, "error");
            else alert(msg);
          }
        }

        function showToast(text, timer = 1500) {
          if (Swal) {
            return Swal.fire({
              title: text,
              toast: true,
              position: "top-end",
              showConfirmButton: false,
              timer,
            });
          }
          console.log("[toast]", text);
          return Promise.resolve();
        }

        // Toggle visibility helpers
        function wireToggles() {
          $toggleNew.on("click", function (e) {
            e.preventDefault();
            const t = $new.attr("type") === "password" ? "text" : "password";
            $new.attr("type", t);
            $(this).text(t === "password" ? "Show" : "Hide");
            $(this).attr("aria-pressed", String(t !== "password"));
          });
          $toggleConf.on("click", function (e) {
            e.preventDefault();
            const t =
              $confirm.attr("type") === "password" ? "text" : "password";
            $confirm.attr("type", t);
            $(this).text(t === "password" ? "Show" : "Hide");
            $(this).attr("aria-pressed", String(t !== "password"));
          });
        }

        // Read token from query string & prefill
        function prefillTokenFromQuery() {
          try {
            const params = new URLSearchParams(window.location.search);
            const t = params.get("token");
            if (t) $token.val(t);
          } catch (e) {
            // ignore
          }
        }

        // Preferred: use GoLankaApi.resetPassword(token, newPassword, confirmPassword)
        async function resetPasswordRequest(
          token,
          newPassword,
          confirmPassword
        ) {
          if (GoLankaApi && typeof GoLankaApi.resetPassword === "function") {
            return GoLankaApi.resetPassword(
              token,
              newPassword,
              confirmPassword
            );
          }

          // Fallback to direct fetch
          const base = (window.API_BASE || "http://localhost:8080").replace(
            /\/+$/,
            ""
          );
          const url = `${base}/api/auth/reset-password`;
          let res;
          try {
            res = await fetch(url, {
              method: "POST",
              credentials: "include",
              headers: {
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify({ token, newPassword, confirmPassword }),
            });
          } catch (networkErr) {
            throw {
              status: 0,
              body: null,
              message:
                "Network error: " +
                (networkErr && networkErr.message
                  ? networkErr.message
                  : networkErr),
            };
          }

          const text = await res.text().catch(() => "");
          let json = null;
          try {
            json = text ? JSON.parse(text) : null;
          } catch (_) {
            json = null;
          }

          if (!res.ok) throw { status: res.status, body: json || text };
          return json || { success: true };
        }

        async function onSubmit(e) {
          e.preventDefault();
          clearErrors();
          $btn.prop("disabled", true).text("Resetting...");

          const token = ($token.val() || "").trim();
          const p1 = $new.val() || "";
          const p2 = $confirm.val() || "";

          // Client-side validation
          if (!token) {
            showFieldError("token", "Reset token required");
            $btn.prop("disabled", false).text("Reset password");
            return;
          }
          if (p1.length < 8) {
            showFieldError(
              "newPassword",
              "Password must be at least 8 characters"
            );
            $btn.prop("disabled", false).text("Reset password");
            return;
          }
          if (p1 !== p2) {
            showFieldError("confirmPassword", "Passwords do not match");
            $btn.prop("disabled", false).text("Reset password");
            return;
          }

          try {
            await resetPasswordRequest(token, p1, p2);

            // success message & redirect to sign in
            await showToast("Password changed");
            await (Swal
              ? Swal.fire(
                  "Success",
                  "Your password was reset. You may now sign in.",
                  "success"
                )
              : Promise.resolve());
            window.location.href = window.SIGNIN_PAGE || "signin.html";
          } catch (err) {
            console.error("Reset error", err);
            // server-side validation errors (common shape: { validationErrors: [ { field, message } ] })
            const body = err && err.body ? err.body : null;
            if (body && Array.isArray(body.validationErrors)) {
              body.validationErrors.forEach((v) => {
                const field = v.field || "";
                const msg = v.message || "Invalid";
                // map possible backend field names to our UI
                if (field === "newPassword" || field === "confirmPassword")
                  showFieldError(field, msg);
                else showFieldError("token", msg);
              });
              await (Swal
                ? Swal.fire(
                    "Validation error",
                    "Fix highlighted errors and retry.",
                    "error"
                  )
                : Promise.resolve());
            } else if (body && body.message) {
              await (Swal
                ? Swal.fire("Error", body.message, "error")
                : Promise.resolve());
            } else if (err && err.message) {
              await (Swal
                ? Swal.fire("Error", err.message, "error")
                : Promise.resolve());
            } else {
              await (Swal
                ? Swal.fire("Error", "Unable to reset password", "error")
                : Promise.resolve());
            }
            $btn.prop("disabled", false).text("Reset password");
          }
        }

        // wire on DOM ready
        $(function () {
          wireToggles();
          prefillTokenFromQuery();
          $form.on("submit", onSubmit);
        });
      })(window.jQuery, window.Swal, window.GoLankaApi);
    </script>
  </body>
</html>
