<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forgot Password — GoLanka Courier</title>
    <link rel="icon" href="../../assets/images/logo.png" />

    <!-- Configure backend base and signin redirect if not already set -->
    <script>
      window.API_BASE = window.API_BASE || "http://localhost:8080";
      window.SIGNIN_PAGE = window.SIGNIN_PAGE || "reset-password.html";
    </script>

    <!-- Tailwind (dev CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- jQuery (used for convenience, page also works without Api helper) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Local CSS -->
    <link rel="stylesheet" href="../../css/styles.css" />
    <link rel="stylesheet" href="../../css/animations.css" />
  </head>

  <body
    class="bg-gray-50 dark:bg-slate-900 min-h-screen flex items-center justify-center p-6"
  >
    <main
      class="w-full max-w-md bg-white dark:bg-slate-800 rounded-xl shadow-lg p-6"
      role="main"
      aria-labelledby="forgot-heading"
    >
      <header class="mb-6">
        <h1 id="forgot-heading" class="text-2xl font-bold">
          Forgot your password?
        </h1>
        <p class="text-sm text-slate-500 mt-1">
          Enter your account email and we'll send a reset link or token.
        </p>
      </header>

      <form id="forgotForm" class="space-y-4" novalidate>
        <label class="block">
          <span class="text-sm font-medium">Email</span>
          <input
            required
            name="email"
            type="email"
            class="input mt-1"
            placeholder="alice@example.com"
            autocomplete="email"
            aria-describedby="email-help"
          />
          <p id="email-help" class="text-xs text-slate-400 mt-1">
            We'll send instructions if that address exists.
          </p>
          <p
            class="text-xs text-red-500 mt-1 hidden field-error"
            data-field="email"
            role="alert"
            aria-live="polite"
          ></p>
        </label>

        <div class="flex items-center gap-3">
          <button id="forgotBtn" type="submit" class="btn btn-primary">
            Send reset link
          </button>
          <a
            href="reset-password.html"
            class="text-sm text-slate-500 hover:underline"
            >Back to sign in</a
          >
        </div>
      </form>
    </main>

    <!-- Prefer central API helper if present (defines window.GoLankaApi) -->
    <script src="../../js/script.js"></script>

    <script>
      /**
       * forgot-password.html
       * Robust "forgot password" page that:
       *  - uses GoLankaApi.apiPostJson when available
       *  - falls back to a fetch() against window.API_BASE
       *  - gracefully handles 204 No Content or JSON responses
       *  - shows field-level validation and friendly alerts
       */

      (function ($, Swal, GoLankaApi) {
        "use strict";

        const $form = $("#forgotForm");
        const $btn = $("#forgotBtn");

        function clearFieldErrors() {
          $(".field-error").each(function () {
            $(this).addClass("hidden").text("");
          });
        }

        function showValidationErrors(errors) {
          // errors: [{ field, message }, ...]
          clearFieldErrors();
          if (!Array.isArray(errors)) return;
          errors.forEach(function (e) {
            const field = String(e.field || "").trim();
            const msg = e.message || "Invalid";
            const $el = $(`.field-error[data-field="${field}"]`);
            if ($el.length) $el.removeClass("hidden").text(msg);
            else console.warn("Validation error:", e);
          });
        }

        // Post helper: returns parsed JSON or { success: true } for 204
        async function postAllowNoContent(path, body) {
          // Prefer GoLankaApi helper if available
          if (GoLankaApi && typeof GoLankaApi.apiPostJson === "function") {
            try {
              const j = await GoLankaApi.apiPostJson(path, body);
              return j ?? { success: true };
            } catch (err) {
              // normalize thrown error to {status, body}
              if (err && err.status) throw err;
              throw { status: err?.status || 500, body: err?.body || err };
            }
          }

          // Fallback: direct fetch using window.API_BASE
          const base = (window.API_BASE || "http://localhost:8080").replace(
            /\/+$/,
            ""
          );
          const url =
            path.startsWith("http") || path.startsWith("https")
              ? path
              : path.startsWith("/")
              ? base + path
              : base + "/" + path;

          let res;
          try {
            res = await fetch(url, {
              method: "POST",
              credentials: "include",
              headers: {
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify(body),
            });
          } catch (networkErr) {
            throw {
              status: 0,
              body: null,
              message: "Network error: " + (networkErr.message || networkErr),
            };
          }

          if (res.status === 204) return { success: true };

          const text = await res.text().catch(() => "");
          let json = null;
          try {
            json = text ? JSON.parse(text) : null;
          } catch (e) {
            json = null;
          }

          if (!res.ok) throw { status: res.status, body: json || text };
          return json || { success: true };
        }

        $form.on("submit", async function (ev) {
          ev.preventDefault();
          clearFieldErrors();
          $btn.prop("disabled", true).text("Sending...");

          const email = $.trim($form.find('[name="email"]').val() || "");
          if (!email) {
            showValidationErrors([
              { field: "email", message: "Email is required" },
            ]);
            $btn.prop("disabled", false).text("Send reset link");
            return;
          }

          try {
            const resp = await postAllowNoContent("/api/auth/forgot-password", {
              email,
            });

            // Friendly success message: avoid leaking account existence
            await Swal.fire({
              icon: "success",
              title: "If that email exists",
              text:
                resp && resp.message
                  ? resp.message
                  : "If the address exists we sent instructions to reset the password.",
            });

            // Redirect to sign-in (or an intermediary "check your email" page if you prefer)
            window.location.href = window.SIGNIN_PAGE || "reset-password.html";
          } catch (err) {
            console.error("Forgot password error", err);

            // Try to display validation errors returned by server
            if (err && err.body && err.body.validationErrors) {
              showValidationErrors(err.body.validationErrors);
              await Swal.fire(
                "Validation error",
                "Fix the form and retry",
                "error"
              );
            } else if (err && err.body && err.body.message) {
              await Swal.fire("Error", err.body.message, "error");
            } else if (err && err.message) {
              await Swal.fire("Error", err.message, "error");
            } else {
              await Swal.fire(
                "Error",
                "Request failed. Try again later.",
                "error"
              );
            }
          } finally {
            $btn.prop("disabled", false).text("Send reset link");
          }
        });
      })(window.jQuery, window.Swal, window.GoLankaApi);
    </script>
  </body>
</html>
