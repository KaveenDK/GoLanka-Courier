<!-- components/header.html -->
<header
  class="site-header sticky top-0 z-50 bg-white dark:bg-slate-900 border-b dark:border-slate-700"
  role="banner"
>
  <!-- Skip link for keyboard users -->
  <a
    class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 bg-white dark:bg-slate-800 p-2 rounded shadow"
    href="#main"
    >Skip to content</a
  >

  <div class="container flex items-center justify-between gap-4 py-3">
    <!-- Brand / Logo -->
    <a
      href="/index.html"
      class="flex items-center gap-3"
      aria-label="GoLanka Courier — Home"
    >
      <img
        src="/assets/images/logo.png"
        alt="GoLanka Courier logo"
        class="w-10 h-10 rounded-md"
        width="40"
        height="40"
      />
      <div class="hidden sm:block leading-tight">
        <div class="text-lg font-bold">
          GoLanka <span class="text-sm font-normal">Courier</span>
        </div>
        <div class="text-xs text-slate-500 dark:text-slate-400">
          Parcel delivery across Sri Lanka
        </div>
      </div>
    </a>

    <!-- Search (desktop) -->
    <form
      id="site-search-form"
      role="search"
      aria-label="Search parcels and tracking"
      class="hidden md:flex items-center flex-1 max-w-xl ml-6"
    >
      <label for="site-search" class="sr-only"
        >Search parcels or tracking</label
      >
      <div class="relative w-full">
        <input
          id="site-search"
          name="q"
          type="search"
          inputmode="search"
          autocomplete="off"
          placeholder="Search tracking number, address or name"
          class="input pl-10 pr-4 w-full"
          aria-describedby="site-search-help"
        />
        <span id="site-search-help" class="sr-only">
          Type tracking number or address, then press Enter
        </span>

        <!-- decorative icon (aria-hidden) -->
        <svg
          class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 opacity-60 pointer-events-none"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M21 21l-4.35-4.35"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle
            cx="11"
            cy="11"
            r="6"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </form>

    <!-- Actions -->
    <div class="flex items-center gap-2">
      <!-- Theme toggle -->
      <button
        id="theme-toggle"
        aria-pressed="false"
        aria-label="Toggle dark mode"
        title="Toggle dark mode"
        class="btn btn-outline hidden sm:inline-flex"
        type="button"
      >
        <span class="sr-only">Toggle theme</span>
        <svg
          id="icon-sun"
          class="w-5 h-5"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
          <circle
            cx="12"
            cy="12"
            r="3"
            stroke="currentColor"
            stroke-width="1.5"
          />
        </svg>
      </button>

      <!-- Notifications -->
      <button
        id="notif-btn"
        class="btn btn-outline relative"
        title="Notifications"
        aria-haspopup="true"
        aria-expanded="false"
        aria-controls="notif-dropdown"
      >
        <span class="sr-only">Open notifications</span>
        <svg
          class="w-5 h-5"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M15 17H9m6-12a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>

        <!-- Visual badge (hidden by default) -->
        <span
          id="notif-badge"
          class="badge hidden absolute -top-1 -right-1"
          aria-hidden="true"
          >0</span
        >
        <span
          id="notif-count-visually-hidden"
          class="sr-only"
          aria-live="polite"
          aria-atomic="true"
        ></span>
      </button>

      <!-- Auth / Profile area -->
      <div id="auth-area" class="relative">
        <!-- Guest actions -->
        <div id="guest-actions" class="flex items-center gap-2">
          <a href="/pages/auth/signin.html" class="btn btn-outline">Sign in</a>
          <a href="/pages/auth/signup.html" class="btn btn-primary">Sign up</a>
        </div>

        <!-- Authenticated user actions (hidden initially) -->
        <div
          id="user-actions"
          class="hidden items-center gap-2"
          aria-hidden="true"
        >
          <button
            id="user-menu-btn"
            class="flex items-center gap-2 btn btn-outline"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="user-menu"
          >
            <img
              id="user-avatar"
              src="/assets/images/avatar-placeholder.png"
              alt="User avatar"
              class="w-8 h-8 rounded-full object-cover"
              width="32"
              height="32"
            />
            <span
              class="hidden sm:inline-block"
              id="user-name"
              aria-hidden="true"
              >User</span
            >
            <svg
              class="w-4 h-4"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M6 9l6 6 6-6"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <div
            id="user-menu"
            class="hidden origin-top-right absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 rounded-lg shadow-lg ring-1 ring-black/5"
            role="menu"
            aria-label="User menu"
          >
            <a
              href="/pages/profile.html"
              class="block px-3 py-2 text-sm hover:bg-gray-50 dark:hover:bg-white/5"
              role="menuitem"
              >Profile</a
            >
            <a
              href="/pages/dashboard-customer.html"
              class="block px-3 py-2 text-sm hover:bg-gray-50 dark:hover:bg-white/5"
              role="menuitem"
              >Dashboard</a
            >
            <button
              id="signout-btn"
              class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 dark:hover:bg-white/5"
              role="menuitem"
            >
              Sign out
            </button>
          </div>
        </div>
      </div>

      <!-- Mobile menu toggle -->
      <button
        id="mobile-toggle"
        class="sm:hidden btn btn-outline ml-1"
        aria-controls="mobile-nav"
        aria-expanded="false"
        aria-label="Open main menu"
      >
        <svg
          class="w-5 h-5"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M4 6h16M4 12h16M4 18h16"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile nav (toggle via main.js) -->
  <nav
    id="mobile-nav"
    class="hidden sm:hidden border-t bg-white dark:bg-slate-900"
    aria-label="Main mobile navigation"
    aria-hidden="true"
  >
    <div class="container py-3">
      <div id="mobile-navbar-placeholder" class="space-y-2">
        <a
          href="/index.html"
          class="block px-3 py-2 rounded hover:bg-slate-50 dark:hover:bg-slate-800"
          >Home</a
        >
        <a
          href="/pages/auth/signin.html"
          class="block px-3 py-2 rounded hover:bg-slate-50 dark:hover:bg-slate-800"
          >Sign in</a
        >
        <a
          href="/pages/auth/signup.html"
          class="block px-3 py-2 rounded hover:bg-slate-50 dark:hover:bg-slate-800"
          >Sign up</a
        >
      </div>
    </div>
  </nav>
</header>
<!-- End of components/header.html -->
