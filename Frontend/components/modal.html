<!-- components/modal.html
     Generic accessible modal fragment.
     Insert into page root and toggle with data attributes or JS helpers.
     Usage:
       // clone template to body (or keep a single instance and update content)
       const t = document.getElementById('tmpl-modal').content.cloneNode(true);
       document.body.appendChild(t);
       // then fill content and call showModal()
-->

<template id="tmpl-modal">
  <div class="modal hidden" id="app-modal" aria-hidden="true">
    <div class="modal-backdrop" data-modal-backdrop></div>

    <div
      class="relative z-50 max-w-xl w-full px-4 animate-slide-up"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="card">
        <div class="flex items-start justify-between gap-4">
          <div>
            <h2 id="modal-title" class="text-lg font-semibold">Modal title</h2>
            <p id="modal-subtitle" class="text-sm hint mt-1">
              Optional subtitle or hint
            </p>
          </div>
          <button
            class="btn btn-outline"
            data-modal-close
            aria-label="Close modal"
          >
            <svg
              class="w-5 h-5"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M6 18L18 6M6 6l12 12"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>

        <div id="modal-body" class="mt-4">
          <!-- dynamic content goes here -->
          <p class="form-help">Modal content placeholder.</p>
        </div>

        <div class="mt-4 flex items-center justify-end gap-2">
          <button class="btn btn-outline" data-modal-cancel>Cancel</button>
          <button class="btn btn-primary" data-modal-confirm>Confirm</button>
        </div>
      </div>
    </div>
  </div>
</template>
